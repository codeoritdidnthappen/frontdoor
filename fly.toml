# TICK-062 (#50). The measure server on Fly.io.
#
# The image is the repo's Dockerfile, unchanged — D-016's fallback chain requires the
# host and the laptop to run the SAME image, so nothing here may alter what is built.
# A fallback changes the network path and nothing else.

app = "frontdoor-measure"
primary_region = "sjc"          # near WNAM, where the R2 buckets live (D-026)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

# A deploy replaces the container filesystem. Without this mount, what a phone published
# survives until the next deploy and then vanishes, with nothing anywhere reporting that it
# happened. The Dockerfile lists exactly what is pointed here -- community scans and owner
# claims -- and what is knowingly left ephemeral. One machine holds this volume, which matches
# the single-machine demo posture.
[mounts]
  source = "frontdoor_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true            # iOS App Transport Security requires TLS from the phone
  # The demo is one shot in an atrium. A cold start is the failure this whole section
  # exists to prevent, so the machine stays up rather than scaling to zero.
  auto_stop_machines = false
  auto_start_machines = true
  # min_machines_running is a NO-OP while auto_stop_machines = false (Fly only consults
  # it when deciding how far auto-stop may scale down). It is kept as documentation of
  # intent, but do NOT rely on it as a floor: if auto_stop_machines is ever re-enabled,
  # re-verify that one machine actually stays up.
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # 512, not 256. At 256 a SINGLE /screen request OOM-killed the gunicorn worker -- one 200 KB
  # PNG was enough, on 2026-09-04:
  #   Out of memory: Killed process 644 (gunicorn) total-vm:572864kB anon-rss:140000kB
  #   [ERROR] Worker (pid:644) was sent SIGKILL! Perhaps out of memory?
  # The client sees a 502 with an EMPTY body -- Fly's proxy filling in for an app that died
  # mid-request -- so it is not even the JSON error contract, and the cause is only visible in
  # `fly logs`. At 512 the same request returns 200 in 6.4s.
  #
  # What changed since 256 was chosen: `frontdoor.faceblur` now loads OpenCV and runs
  # decode -> blur -> re-encode on every /screen image. cv2's resident footprint alone is
  # substantial, and the earlier "69 MiB serving /health" figure was measured before it existed.
  #
  # This value lives here and NOT only in `fly scale`: a `fly scale memory` change is reverted by
  # the next `fly deploy`, which is exactly what happened on 2026-09-04 -- the machine was scaled,
  # then a deploy silently put it back to 256 and the OOM returned.
  memory = "512mb"
