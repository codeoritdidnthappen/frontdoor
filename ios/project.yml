# XcodeGen spec. The .xcodeproj is generated, not committed: a .pbxproj is a merge-conflict
# generator and four people are working in this repo. Regenerate with `xcodegen generate`
# from the ios/ directory.
name: FrontdoorCapture
options:
  bundleIdPrefix: com.frontdoor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  FrontdoorCapture:
    type: application
    platform: iOS
    sources:
      - path: FrontdoorCapture
        # Prose that documents the tree, not payload. Resources/Fonts/README.md says which font
        # files belong beside it; bundling it would ship a markdown file to a phone.
        excludes:
          - "**/*.md"
    info:
      path: FrontdoorCapture/Resources/Info.plist
      properties:
        CFBundleDisplayName: Frontdoor
        UILaunchScreen: {}
        # The EntryMap type system (UI/DesignSystem/EntryMapTypography.swift). The files are not
        # committed -- Resources/Fonts/README.md says which four to drop in and why. Registering a
        # font that is not there is harmless: iOS logs it and Font.custom falls back to the system
        # face. EntryMapTypography.Face.fileName is the other half of this list, and
        # tests/test_ios_design_system.py fails if the two ever disagree.
        UIAppFonts:
          - AtkinsonHyperlegibleNext-Regular.ttf
          - AtkinsonHyperlegibleNext-SemiBold.ttf
          - AtkinsonHyperlegibleNext-Bold.ttf
          - NunitoSans-ExtraBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # D-014: capture geometry is fixed, so the instrument does not rotate.
        NSCameraUsageDescription: >-
          Frontdoor photographs storefront entrances to measure threshold rise.
          The camera is the measuring instrument; without it the app cannot capture.
        NSMotionUsageDescription: >-
          Frontdoor records the gravity vector at the instant of capture, which is what
          makes capture angle a measured quantity rather than an operator's estimate.
        # Upload target and ingest key (TICK-029, #33). Both come from build settings so the
        # key is never committed -- same arrangement as DEVELOPMENT_TEAM below. The key
        # authorises ingest only; it is not an R2 credential and cannot read the bucket.
        FrontdoorServerURL: $(FRONTDOOR_SERVER_URL)
        FrontdoorUploadKey: $(FRONTDOOR_UPLOAD_KEY)
    settings:
      base:
        # Free provisioning (D-025, TICK-001). Set DEVELOPMENT_TEAM locally; it is
        # deliberately not committed, because it differs per team member's Apple ID.
        CODE_SIGN_STYLE: Automatic
        # No app icon, stated rather than defaulted. The design-system port added
        # Resources/Assets.xcassets, and the moment a catalog exists Xcode looks for an icon set
        # named by ASSETCATALOG_COMPILER_APPICON_NAME -- which defaults to "AppIcon" -- and fails
        # the build when it is missing. Before that commit there was no catalog and so no icon was
        # expected; this restores that, explicitly.
        #
        # NOT solved by drawing one. The largest square artwork in the approved library is 384 px
        # and an iOS icon wants 1024; upscaling it, or inventing a mark, is exactly the failure
        # #367 warns about with svg/brand/mark-primary.svg. When the library ships a 1024 icon it
        # lands here as AppIcon.appiconset and this line goes.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # The public endpoint (ARCHITECTURE section 6). The key is deliberately empty here and
        # set locally; an empty key disables upload and the app says so rather than failing quietly.
        FRONTDOOR_SERVER_URL: https:/$()/frontdoor-measure.fly.dev
        FRONTDOOR_UPLOAD_KEY: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.frontdoor.capture
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: Network.framework
      - sdk: Vision.framework
    preBuildScripts:
      - name: "Assert no ARKit (D-015)"
        script: '"$SRCROOT/Scripts/assert-no-arkit.sh" "$SRCROOT"'
        basedOnDependencyAnalysis: false

  FrontdoorCaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FrontdoorCaptureTests
    dependencies:
      - target: FrontdoorCapture
    settings:
      base:
        # Cover the pure validation layer, which needs no camera. CI runs on Linux with no Xcode
        # (TICK-005 put macOS runners explicitly out of scope), so these run locally via
        # `xcodebuild test`; the Python suite still guards the ARKit boundary on every PR.
        GENERATE_INFOPLIST_FILE: YES
