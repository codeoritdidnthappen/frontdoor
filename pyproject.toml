[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontdoor"
version = "0.1.0"
description = "Monocular measurement of storefront accessibility"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21", "rfc3339-validator>=0.1.1"]

[project.optional-dependencies]
server = ["flask>=3"]
dev = ["pytest>=8", "flask>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frontdoor = ["*.json"]
frontdoor_server = ["*.json"]
