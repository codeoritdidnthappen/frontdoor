<!-- The two families, served from this origin instead of the CDN stylesheet the design
     source links. Three reasons, and the first is the one that matters on the day: the
     fallback chain ends in system-ui, so a venue with slow, captive-portalled or filtered
     wifi silently drops the whole type system and nothing says so. Second, this page is
     installable and meant to launch with no signal -- a font fetched from someone else
     cannot be in the service worker's shell. Third, a third-party request on every load
     discloses the visitor's IP and user agent, which on a product where people state
     disability-related needs is a decision, not a default.

     Both families are OFL; the licences travel with them in src/frontdoor_server/fonts.
     `swap` is kept as the display strategy: text must be readable before the face
     arrives, which is the same reason native falls back rather than blocking. -->
<style>
@font-face {
  font-family: 'Atkinson Hyperlegible Next';
  src: url('/app-fonts/AtkinsonHyperlegibleNext-Variable.woff2') format('woff2-variations');
  font-weight: 200 800; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Atkinson Hyperlegible Next';
  src: url('/app-fonts/AtkinsonHyperlegibleNext-Italic-Variable.woff2') format('woff2-variations');
  font-weight: 200 800; font-style: italic; font-display: swap;
}
@font-face {
  font-family: 'Nunito Sans';
  src: url('/app-fonts/NunitoSans-ExtraBold.ttf') format('truetype');
  font-weight: 800; font-style: normal; font-display: swap;
}
