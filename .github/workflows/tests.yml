name: tests

on:
  # Every pull request, not only those based on main. A stacked PR targets its parent branch, so
  # `branches: [main]` skipped it entirely — and when the parent merged, GitHub retargeted the
  # child to main and it merged with no check ever having run. That is how TICK-014 reached main
  # with a test module that cannot be imported.
  pull_request:
  # Also on push to main, so a broken merge is visible on main itself rather than only on the next
  # pull request that happens to inherit it.
  push:
    branches: [main]

# Read the tree and nothing else. Without this block the job runs with the
# repository's DEFAULT token scope, which is whatever the org setting happens to
# be -- often write to contents, packages, issues and pull requests. This
# workflow runs on `pull_request`, so that token would be sitting in a job that
# has just installed and executed code from a contributor's branch.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest
